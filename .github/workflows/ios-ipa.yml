name: iOS IPA (iPhone 17 Pro Max)

on:
  push:
    branches: [kyty-sync-2026-09-20, main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'ios/**'
  workflow_dispatch:

# KytyPS5 is GPL-2.0-only; Magnus iOS glue is GPL-3.0-or-later.
# This workflow builds the Magnus static core (KyTy Sep-20 + FEX + MoltenVK)
# for iphoneos arm64. It does NOT include games, firmware, keys, or
# copyrighted Sony code. Use only legally obtained game dumps.

env:
  XCODE_VERSION: '26.0'
  CMAKE_VERSION: '3.30.5'
  MOLTENVK_VERSION: '1.3.0'
  # iOS-capable FEX fork (upstream FEX-Emu is Linux-only). Pin matches
  # willfaust/Madeira's tested FEX submodule; its root CMake accepts iOS.
  FEX_REPO: 'https://github.com/willfaust/FEX.git'
  FEX_REF: '053c385ecc9090702e4959a1d96752ea918a6110'
  KYTY_REF: 'ba55ba5dc541db1920c60f3e2f8dd0c6420dca8e'

jobs:
  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install deps
        run: |
          brew install cmake ninja glslang molten-vk || true
          cmake --version
          ninja --version
          glslangValidator --version || true

      - name: Fetch FEX iOS fork (sibling of repo, as CMake expects ../FEX)
        run: |
          cd ..
          if [ ! -d FEX ]; then git init FEX && git -C FEX remote add origin ${{ env.FEX_REPO }}; fi
          git -C FEX fetch --depth 1 origin ${{ env.FEX_REF }}
          git -C FEX checkout -q FETCH_HEAD
          git -C FEX submodule update --init --recursive
          ls FEX/External/vixl/src

      - name: Build FEX for iphoneos (provides libFEXCore.a etc.)
        run: |
          pip3 install --quiet packaging setuptools
          cd ../FEX
          cmake -S . -B build-iphoneos -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTUNE_CPU=none \
            -DBUILD_TESTING=OFF
          cmake --build build-iphoneos --parallel $(sysctl -n hw.ncpu)
          find build-iphoneos -name 'libFEXCore*.a' -o -name 'libcephes_128bit.a' -o -name 'libsoftfloat_3e.a' -o -name 'libtiny-json.a' | head -n 20

      - name: Fetch MoltenVK iphoneos static lib
        run: |
          mkdir -p ../MoltenVK
          cd ../MoltenVK
          # NOTE: macos.tar only ships macos-arm64 slices. iOS needs ios-arm64.
          curl -L -o moltenvk-ios.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v${{ env.MOLTENVK_VERSION }}/MoltenVK-ios.tar
          tar xf moltenvk-ios.tar
          echo "--- libMoltenVK.a candidates ---"
          find . -name "libMoltenVK.a"
          echo "--- mvk_private_api.h candidates ---"
          find . -name "mvk_private_api.h"
          # Fail fast if the iOS slice is missing (do NOT silently use a macOS slice).
          if ! find . -path "*ios-arm64*libMoltenVK.a" | grep -q .; then
            echo "ERROR: ios-arm64/libMoltenVK.a not found in MoltenVK-ios.tar" >&2
            exit 1
          fi

      - name: Configure (iphoneos arm64, Release)
        run: |
          MOLTENVK_LIB=$(find ../MoltenVK -path "*ios-arm64*libMoltenVK.a" | head -n 1)
          MVK_HEADER=$(find ../MoltenVK -name "mvk_private_api.h" | head -n 1)
          # Header lives at <root>/MoltenVK/mvk_private_api.h; include dir is <root>.
          MOLTENVK_INC=$(dirname "$MVK_HEADER" | xargs dirname)
          echo "MoltenVK lib=$MOLTENVK_LIB inc=$MOLTENVK_INC"
          test -f "$MOLTENVK_LIB" || { echo "ERROR: MoltenVK ios lib missing: $MOLTENVK_LIB" >&2; exit 1; }
          test -f "$MOLTENVK_INC/MoltenVK/mvk_private_api.h" || { echo "ERROR: MoltenVK headers missing under: $MOLTENVK_INC" >&2; exit 1; }
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_BUILD_ORIGIN=Fork \
            -DKYTY_BUILD_REPOSITORY=${{ github.repository }} \
            -DMAGNUS_MOLTENVK_LIBRARY=$MOLTENVK_LIB \
            -DMAGNUS_MOLTENVK_INCLUDE_DIR=$MOLTENVK_INC \
            -DBUILD_TESTING=OFF \
            -DKYTY_BUILD_LAUNCHER=OFF

      - name: Build kyty_emulator static lib
        run: cmake --build build-ios --target kyty_emulator --parallel $(sysctl -n hw.ncpu)

      - name: Build unsigned IPA (no paid signing; user re-signs)
        run: |
          chmod +x ios/Stinger/build-unsigned-ipa.sh
          bash ios/Stinger/build-unsigned-ipa.sh build-unsigned

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: magnus-unsigned-ipa
          path: build-unsigned/MagnusPS5-unsigned.ipa
          if-no-files-found: error

      - name: Validate SideStore packaging prereqs
        run: |
          ls build-ios/*.a || find build-ios -name "*.a" | head
          bash tools/check-ipa.sh || true

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnus-ios-core-arm64
          path: build-ios/**/libkyty_emulator.a
          if-no-files-found: warn
