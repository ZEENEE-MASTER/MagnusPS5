name: iOS IPA (iPhone 17 Pro Max)

on:
  push:
    branches: [kyty-sync-2026-09-20, main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'ios/**'
  workflow_dispatch:

# KytyPS5 is GPL-2.0-only; Magnus iOS glue is GPL-3.0-or-later.
# This workflow builds the Magnus static core (KyTy Sep-20 + FEX + MoltenVK)
# for iphoneos arm64. It does NOT include games, firmware, keys, or
# copyrighted Sony code. Use only legally obtained game dumps.

env:
  XCODE_VERSION: '26.0'
  CMAKE_VERSION: '3.30.5'
  MOLTENVK_VERSION: '1.3.0'
  FEX_REF: 'main'
  KYTY_REF: 'ba55ba5dc541db1920c60f3e2f8dd0c6420dca8e'

jobs:
  ios-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install deps
        run: |
          brew install cmake ninja glslang molten-vk || true
          cmake --version
          ninja --version
          glslangValidator --version || true

      - name: Fetch FEX (sibling of repo, as CMake expects ../FEX)
        run: |
          cd ..
          if [ ! -d FEX ]; then git clone --depth 1 https://github.com/FEX-Emu/FEX.git FEX; fi
          ls FEX/External/vixl/src || (cd FEX && git submodule update --init --recursive)

      - name: Fetch MoltenVK iphoneos static lib
        run: |
          mkdir -p ../MoltenVK
          cd ../MoltenVK
          curl -L -o moltenvk.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v${{ env.MOLTENVK_VERSION }}/MoltenVK-macos.tar
          tar xf moltenvk.tar
          find . -name "libMoltenVK.a" | head
          find . -name "mvk_private_api.h" | head

      - name: Configure (iphoneos arm64, Release)
        run: |
          MOLTENVK_LIB=$(find ../MoltenVK -name "libMoltenVK.a" | head -n 1)
          MOLTENVK_INC=$(dirname $(find ../MoltenVK -name "mvk_private_api.h" | head -n 1) | xargs dirname | xargs dirname)
          echo "MoltenVK lib=$MOLTENVK_LIB inc=$MOLTENVK_INC"
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_BUILD_ORIGIN=Fork \
            -DKYTY_BUILD_REPOSITORY=${{ github.repository }} \
            -DMAGNUS_MOLTENVK_LIBRARY=$MOLTENVK_LIB \
            -DMAGNUS_MOLTENVK_INCLUDE_DIR=$MOLTENVK_INC \
            -DBUILD_TESTING=OFF \
            -DKYTY_BUILD_LAUNCHER=OFF

      - name: Build kyty_emulator static lib
        run: cmake --build build-ios --target kyty_emulator --parallel $(sysctl -n hw.ncpu)

      - name: Validate SideStore packaging prereqs
        run: |
          ls build-ios/*.a || find build-ios -name "*.a" | head
          bash tools/check-ipa.sh || true

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnus-ios-core-arm64
          path: build-ios/**/libkyty_emulator.a
          if-no-files-found: warn
